  <head>
    <meta charset="utf-8" />

    <title>ページが見つかりません | 住所チェック＆整形</title>
    <meta name="description" content="" />
    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #5c5f62;
        --bg: #ffffff;
        --line: #e3e3e3;
        --accent: #0a6b4f;
        --soft: #f4f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
        color: var(--fg);
        background: var(--bg);
        line-height: 1.75;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: var(--soft);
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 16px;
      }
      header .wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 20px;
        padding: 14px 16px;
      }
      header a.brand {
        font-weight: 700;
        color: var(--fg);
        text-decoration: none;
        font-size: 17px;
      }
      header nav a {
        color: var(--muted);
        text-decoration: none;
        margin-right: 14px;
        font-size: 14px;
      }
      header nav a:hover,
      main a:hover {
        text-decoration: underline;
      }
      main {
        padding: 28px 0 56px;
      }
      main a {
        color: var(--accent);
      }
      h1 {
        font-size: 26px;
        margin: 0 0 16px;
        line-height: 1.35;
      }
      h2 {
        font-size: 20px;
        margin: 36px 0 10px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }
      h3 {
        font-size: 16px;
        margin: 24px 0 6px;
      }
      p,
      li {
        font-size: 15.5px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 12px 0 20px;
        font-size: 14px;
        display: block;
        overflow-x: auto;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 6px 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--soft);
        white-space: nowrap;
      }
      code {
        background: var(--soft);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 90%;
      }
      pre {
        background: var(--soft);
        padding: 12px;
        overflow-x: auto;
        border-radius: 6px;
      }
      blockquote {
        margin: 12px 0;
        padding: 8px 14px;
        border-left: 4px solid var(--accent);
        background: var(--soft);
      }
      .subnav {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 14px;
        margin: 0 0 20px;
        font-size: 14px;
      }
      .subnav a {
        margin-right: 12px;
        white-space: nowrap;
      }
      .updated {
        color: var(--muted);
        font-size: 13px;
      }
      footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        padding: 18px 0 32px;
      }
      footer a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">

    </header>
    <main>

    </main>

  </body>
</html>
